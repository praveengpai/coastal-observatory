# Kerala Coastal One Health Observatory: production stack.
# ODK Central runs as its own stack (github.com/getodk/central) on the same server or another one.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: observatory
      POSTGRES_USER: observatory
      POSTGRES_PASSWORD: ${OBS_DB_PASSWORD:?set OBS_DB_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OBS_DATABASE_URL: postgresql+psycopg://observatory:${OBS_DB_PASSWORD}@db:5432/observatory
    depends_on: [db]
    ports: ["127.0.0.1:8000:8000"]     # reached through Caddy (install_vps.sh) or the nginx profile
    networks: [internal]

  jobs:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OBS_DATABASE_URL: postgresql+psycopg://observatory:${OBS_DB_PASSWORD}@db:5432/observatory
    command: ["sh", "-c", "while true; do python -m tools.jobs sync; sleep 900; done & while true; do python -m tools.jobs rules; sleep 3600; done & while true; do python -m tools.jobs weather; sleep 43200; done"]
    healthcheck:
      disable: true                     # no web server in this container; the app container has the health check
    depends_on: [db]
    networks: [internal]

  demo:                                 # public demo with invented data: docker compose --profile demo up -d
    profiles: ["demo"]
    build: .
    restart: unless-stopped
    environment:
      OBS_DATABASE_URL: sqlite:////tmp/demo.db       # its own throwaway database, never the real one
      OBS_ENVIRONMENT: staging
      OBS_DEMO_MODE: "1"
      OBS_SECRET_KEY: ${OBS_SECRET_KEY:-change-me}-demo-only
      OBS_DEMO_PASSWORD: ${OBS_DEMO_PASSWORD:-demo-password-2026}
    command: ["sh", "-c", "while true; do python -m tools.seed_demo --reset && timeout 86400 uvicorn app.main:app --host 0.0.0.0 --port 8000; done"]
    ports: ["127.0.0.1:8001:8000"]
    networks: [demo]                    # kept apart from the real database

  web:                                  # only when the Observatory has the server to itself:
    profiles: ["nginx"]                 #   docker compose --profile nginx up -d
    image: nginx:1.27
    restart: unless-stopped
    ports: ["443:443", "80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${OBS_TLS_DIR:-./deploy/tls}:/etc/nginx/tls:ro
    depends_on: [app]
    networks: [internal]

volumes:
  dbdata:

networks:
  internal:
  demo:
