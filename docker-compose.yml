# Kochi Coastal One Health Observatory: production stack.
# ODK Central runs as its own stack (github.com/getodk/central) on the same server or another one.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: observatory
      POSTGRES_USER: observatory
      POSTGRES_PASSWORD: ${OBS_DB_PASSWORD:?set OBS_DB_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OBS_DATABASE_URL: postgresql+psycopg://observatory:${OBS_DB_PASSWORD}@db:5432/observatory
    depends_on: [db]
    ports: ["127.0.0.1:8000:8000"]     # reached through Caddy (install_vps.sh) or the nginx profile
    networks: [internal]

  jobs:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OBS_DATABASE_URL: postgresql+psycopg://observatory:${OBS_DB_PASSWORD}@db:5432/observatory
    command: ["sh", "-c", "while true; do python -m tools.jobs sync; sleep 900; done & while true; do python -m tools.jobs rules; sleep 3600; done & while true; do python -m tools.jobs weather; sleep 43200; done"]
    depends_on: [db]
    networks: [internal]

  web:                                  # only when the Observatory has the server to itself:
    profiles: ["nginx"]                 #   docker compose --profile nginx up -d
    image: nginx:1.27
    restart: unless-stopped
    ports: ["443:443", "80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${OBS_TLS_DIR:-./deploy/tls}:/etc/nginx/tls:ro
    depends_on: [app]
    networks: [internal]

volumes:
  dbdata:

networks:
  internal:
